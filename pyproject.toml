[project]
name = "sales-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tereshchuk1", email = "pikilla2017@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "plotly>=7.1.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
